<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified AIO gear icon for minimap player indicator -->
  <!-- Dark circle background -->
  <circle cx="32" cy="32" r="30" fill="#1A1A1A"/>

  <!-- Gear teeth - 8 teeth (simplified for small size) -->
  <g fill="#C09C57">
    <!-- Top -->
    <rect x="28" y="2" width="8" height="10" rx="2"/>
    <!-- Bottom -->
    <rect x="28" y="52" width="8" height="10" rx="2"/>
    <!-- Left -->
    <rect x="2" y="28" width="10" height="8" rx="2"/>
    <!-- Right -->
    <rect x="52" y="28" width="10" height="8" rx="2"/>
    <!-- Top-right -->
    <rect x="44" y="8" width="8" height="10" rx="2" transform="rotate(45, 48, 13)"/>
    <!-- Top-left -->
    <rect x="12" y="8" width="8" height="10" rx="2" transform="rotate(-45, 16, 13)"/>
    <!-- Bottom-right -->
    <rect x="44" y="46" width="8" height="10" rx="2" transform="rotate(-45, 48, 51)"/>
    <!-- Bottom-left -->
    <rect x="12" y="46" width="8" height="10" rx="2" transform="rotate(45, 16, 51)"/>
  </g>

  <!-- Outer gear ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#C09C57" stroke-width="6"/>

  <!-- Center hole -->
  <circle cx="32" cy="32" r="10" fill="#1A1A1A" stroke="#C09C57" stroke-width="1.5"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="#C09C57"/>
</svg>
